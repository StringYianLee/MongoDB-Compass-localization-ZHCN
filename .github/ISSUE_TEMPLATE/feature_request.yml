name: ✨ 功能建议
description: 提出新功能、改进点或本地化范围扩展建议
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请尽量描述**使用场景与要解决的问题**，而不是只给结论。
        较大的方案取舍建议先在 [Ideas 讨论区](https://github.com/StringYianLee/MongoDB-Compass-localization-ZHCN/discussions/categories/ideas) 征集意见。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下遇到了什么不便？希望达成什么目标？
      placeholder: "例如：每次升级 Compass 后都要手动重新汉化，希望能自动检测并提示……"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望工具如何表现？界面、命令或行为层面的具体描述
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
      description: 现有的绕过方式、其他工具的做法等

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 汉化词条 / 翻译质量
        - 桌面界面（Flet）
        - Web 版
        - 备份 / 还原 / 升级
        - MongoDB 版本信息 / 下载安装
        - 安装包 / 构建
        - 文档
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: pr
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现该功能
        - label: 我可以协助测试
